name: Check the live site
# Push anything to the live-check branch: this looks at https://tete21.onrender.com from GitHub's machines and saves
# what it saw to the live-check-results branch (result.txt), so a deploy can be checked without a browser.
on:
  push:
    branches: [live-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Look at the live site
        run: |
          set +e
          U=https://tete21.onrender.com
          npm i --no-save --silent ws@8 >/dev/null 2>&1
          {
            echo "checked: $(date -u +%FT%TZ)"
            echo "health: $(curl -s --max-time 60 $U/health)"
            c=$(curl -s -o /tmp/p -w '%{http_code}' --max-time 60 $U/)
            echo "page: $c | sign-in page: $(grep -c 'Members only' /tmp/p) | game script: $(grep -c 'src=\"app.js\"' /tmp/p)"
            for f in app.js engine.js index.html music/index.json ice; do echo "$f: $(curl -s -o /tmp/f -w '%{http_code}' --max-time 60 $U/$f) $(grep -c 'src=\"app.js\"' /tmp/f)"; done
            echo "api/me: $(curl -s --max-time 60 $U/api/me | head -c 200)"
            echo "app download for a stranger: $(curl -s -o /dev/null -w '%{http_code}' --max-time 60 $U/download/tete.apk)"
            echo "assetlinks: $(curl -s -o /tmp/al -w '%{http_code}' --max-time 60 $U/.well-known/assetlinks.json) $(grep -o 'com.tete21.app' /tmp/al | head -1) $(grep -o 'DA:2B:7F' /tmp/al | head -1)"
            echo "app.js has phone music: $(curl -s --max-time 60 -o /dev/null -w '%{http_code}' $U/app.js) (403 = members only, as it should be)"
            node ws-probe.mjs
          } > /tmp/result.txt 2>&1
          cat /tmp/result.txt
      - name: Save what it saw
        run: |
          mkdir out && cd out && git init -q && git checkout -q -b live-check-results
          cp /tmp/result.txt result.txt
          git config user.name "live-check" && git config user.email "live-check@users.noreply.github.com"
          git add result.txt && git commit -q -m "live check $(date -u +%FT%TZ)"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" live-check-results
